name: Sync from Codeberg
on:
  schedule: [{ cron: '23 4 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone --bare https://codeberg.org/RevK/ESP32-Faikout.git up
          cd up
          git lfs fetch origin main
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git lfs push "$REMOTE" main
          git push --force --tags "$REMOTE" refs/heads/main:refs/heads/main